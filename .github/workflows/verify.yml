name: verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pycountry openpyxl
      - name: every script compiles (a comment once swallowed a statement, 13 Nov 2026)
        run: python -m compileall -q scripts
      - name: instrument validity tests (citation check, derivation gate, extractor validation)
        run: python -m pytest -q tests
      - name: replay — project frame and site data rebuild from archived inputs, no API
        run: |
          python scripts/frame/project_frame.py
          git diff --exit-code --stat -- data/frame/projects.csv
      - name: the index of dated and historical files is current
        run: python scripts/provenance/build_archive_index.py --check
      - name: website data are current and contain no unlisted translation
        run: python scripts/site/build_site_data.py --check
      - name: the numbers in PROJECT_BRIEF.md match the data files
        run: python scripts/pipeline/update_brief.py --check
      - name: every model run has a complete run record and the run statement is current
        run: python scripts/pipeline/run_statement.py --check
      - name: no secrets in tree
        run: "! grep -rIl 'sk-ant-\\|github_pat_\\|OPENAI_API_KEY=' --exclude-dir=.git --exclude-dir=.github . "
